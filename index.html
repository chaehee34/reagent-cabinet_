<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시약장 검색 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">□</span>
      <div class="brand-text">
        <h1>시약장 검색 시스템</h1>
        <p id="total-count" class="brand-sub">데이터를 불러오는 중…</p>
      </div>
    </div>
    <div class="topbar-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="시약명, 화학식, 제조사로 검색" autocomplete="off">
        <button id="search-clear" class="icon-btn" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <select id="manufacturer-select">
        <option value="">전체 제조사</option>
      </select>
      <select id="sort-select">
        <option value="default">기본 순서</option>
        <option value="title-asc">시약명 (A→Z)</option>
        <option value="title-desc">시약명 (Z→A)</option>
        <option value="mw-asc">분자량 (낮은순)</option>
        <option value="mw-desc">분자량 (높은순)</option>
      </select>
    </div>
  </header>

  <div class="body">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <button class="drawer-item drawer-all active" data-location="">
          <span class="drawer-label">전체 보기</span>
          <span class="drawer-count" id="count-all">—</span>
        </button>

        <div class="drawer-group">
          <p class="drawer-group-title">시약장 A–J</p>
          <div id="group-aj"></div>
        </div>

        <div class="drawer-group">
          <p class="drawer-group-title">투명 시약장 A1–A3</p>
          <div id="group-a123"></div>
        </div>

        <div class="drawer-group">
          <p class="drawer-group-title">투명 시약장 N1–N3</p>
          <div id="group-n123"></div>
        </div>

        <div class="drawer-group">
          <p class="drawer-group-title">교수님 시약장</p>
          <div id="group-prof"></div>
        </div>

        <div class="drawer-group">
          <p class="drawer-group-title">기타</p>
          <div id="group-etc"></div>
        </div>
      </div>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="시약장 목록 열기/닫기">
      <span></span><span></span><span></span>
    </button>

    <main class="content">
      <div class="content-meta">
        <p id="result-summary">전체 시약을 불러오는 중…</p>
      </div>

      <div class="table-wrap">
        <table class="reagent-table">
          <thead>
            <tr>
              <th class="col-no">No.</th>
              <th class="col-title">시약명</th>
              <th class="col-formula">화학식</th>
              <th class="col-mw">분자량</th>
              <th class="col-purity">순도</th>
              <th class="col-manuf">제조사</th>
              <th class="col-loc">위치</th>
              <th class="col-memo">메모</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <p id="empty-state" class="empty-state" hidden>검색 결과가 없습니다. 다른 검색어나 필터를 시도해보세요.</p>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</div>

<div class="detail-overlay" id="detail-overlay" hidden>
  <div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button class="detail-close" id="detail-close" aria-label="닫기">×</button>
    <p class="detail-tag" id="detail-tag">No.</p>
    <h2 class="detail-title" id="detail-title"></h2>
    <div class="detail-grid">
      <div class="detail-field">
        <p class="detail-label">화학식</p>
        <p class="detail-value mono" id="detail-formula"></p>
      </div>
      <div class="detail-field">
        <p class="detail-label">분자량</p>
        <p class="detail-value mono" id="detail-mw"></p>
      </div>
      <div class="detail-field">
        <p class="detail-label">순도</p>
        <p class="detail-value" id="detail-purity"></p>
      </div>
      <div class="detail-field">
        <p class="detail-label">제조사</p>
        <p class="detail-value" id="detail-manuf"></p>
      </div>
      <div class="detail-field">
        <p class="detail-label">보관 위치</p>
        <p class="detail-value" id="detail-loc"></p>
      </div>
    </div>
  </div>
</div>

<script src="reagents_data_v2.js"></script>
<script src="storage-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
